# Example subsetting of minimap and scalar features
type: sc2-replay-outcome
args:
  features:
    - minimaps
    - scalars
  timepoints:
    min: 2
    max: 20
    step: 0.5
  sampler_cfg:
    type: sql
    args:
      database: $ENV:gamedata.db
      filter_query:
        - game_length > 6720
        - read_success = 1
        - parse_success = 1
        - playerAPM > 30
loader_type: DALI
loader_args:
  batch_size: 1
